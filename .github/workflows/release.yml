name: Build and release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build installer
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win --x64 --publish never 2>&1 | tee build.log || { tail -25 build.log | sed 's/^/::error::/'; exit 1; }
          ls -la dist
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          V=$(node -p "require('./package.json').version")
          cd dist
          ls -la
          gh release create "v$V" --title "v$V" --notes "WrapMates Reports $V" "WrapMates-Reports-Setup-$V.exe" "WrapMates-Reports-Setup-$V.exe.blockmap" latest.yml 2>&1 || { echo "::error::release upload failed"; exit 1; }
